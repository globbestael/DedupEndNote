# Activate the test profile for all @SpringBootTest tests via @ActiveProfiles("test") on each test class.
# spring.profiles.active cannot be set reliably here because environment variables (e.g. SPRING_PROFILES_ACTIVE=dev) take precedence.
spring.application.version=@project.version@

# Production dedup.* properties live in src/main/resources/application.properties and do NOT carry
# over here because this file fully shadows it on the test classpath. All @Value fields have defaults,
# so no properties need to be listed here. Individual tests that need a specific value use
# @SpringBootTest(properties = "dedup.max-records=2") etc.
#
# dedup.max-concurrent-runs = 4
# dedup.max-records = 100000
# dedup.timeout-minutes = 20
# dedup.upload-cooldown-seconds = 10
