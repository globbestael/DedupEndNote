server.port = 9777
spring.application.version=@project.version@
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force-response=true

spring.main.banner-mode=off
spring.thymeleaf.cache=true
spring.servlet.multipart.max-file-size= 150MB
spring.servlet.multipart.max-request-size= 150MB

# See https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide
# spring.devtools.livereload.enabled=true

logging.level.ch.qos.logback=info
logging.file.name=./logs/dedupendnote.log
logging.level.edu.dedupendnote.services=info
logging.level.edu.dedupendnote.services.IOService=info

upload-dir = upload-dir

dedup.max-concurrent-runs = 4
dedup.max-records = 100000
dedup.timeout-minutes = 20
dedup.upload-cooldown-seconds = 10