<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
	<th:block th:fragment="headScripts">
		<script th:src="@{/webjars/jquery/jquery.min.js}"></script>
		<script th:src="@{/webjars/jquery-ui/jquery-ui.min.js}"></script>
		<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
		<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}" type="text/javascript"></script>
		<script th:src="@{/webjars/sockjs-client/dist/sockjs.min.js}"></script>
		<script th:src="@{/webjars/stomp-websocket/stomp.min.js}"></script>
		<link rel="stylesheet" href="/resources/common-style.css">
		<script src="/resources/dedup-utils.js"></script>
	</th:block>
	<title>dummy</title>
</head>

<body>
	<th:block th:fragment="navbar(firstLinkText, firstLinkHref, restartHref)">
		<nav class="navbar navbar-light bg-light border-bottom fixed-top">
			<div class="container">
				<span class="navbar-brand fw-bold">DedupEndNote <small class="fw-normal text-muted fs-6"
						th:text="'v' + ${projectVersion}">v1.1.5</small></span>
				<div class="d-flex gap-2">
					<a th:href="${firstLinkHref}" class="btn btn-outline-secondary btn-sm"
						th:text="${firstLinkText}">Link</a>
					<a href="/details" target="window2" class="btn btn-outline-secondary btn-sm">Details ↗</a>
					<a href="/changelog" target="window2" class="btn btn-outline-secondary btn-sm">Changelog ↗</a>
					<a th:href="${restartHref}" class="btn btn-primary btn-sm">Restart</a>
				</div>
			</div>
		</nav>
	</th:block>

	<th:block th:fragment="step3">
		<!-- Step 3: Result -->
		<div id="step3" class="step-card step-waiting">
			<div class="step-header">
				<h4><span class="step-number">3</span>Result</h4>
			</div>
			<form class="form-horizontal" id="getResultFile_form" method="post" th:action="@{|/getResultFile|}">
				<input type="hidden" name="fileNameResultFile" id="fileNameResultFile" />
				<input type="hidden" name="deduplicationModeResultFile" id="deduplicationModeResultFile" />
				<input type="hidden" name="wssessionId" th:value="${wssessionId}" />
				<button type="submit" id="buttonResultFile" disabled class="btn btn-primary mb-2"
					onclick="this.form.submit(); markAsDone('#step3');">Get the result</button>
			</form>
		</div>
	</th:block>
</body>

</html>
