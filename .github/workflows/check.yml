# The cheap checks, on every PR and every push to main.
# Validation tests (need truth files) and browser tests (need Chromium) are not run here.
name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unit tests
        run: ./mvnw -B test -Punit-tests

      - name: Integration tests
        run: ./mvnw -B test -Pintegration-tests
