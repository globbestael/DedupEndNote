# On every PR and every push to main, three parallel jobs:
# - config: schema validation of the workflow and Dependabot config files (check-jsonschema)
# - check: build and static analysis (Error Prone, NullAway, SpotBugs + Find Security Bugs)
# - test: unit and integration tests, with the input files from the separate
#   globbestael/dedupendnote-testdata repository at the commit pinned in testdata.ref.
#   Validation and browser tests are not run here (huge truth files, Chromium).
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # No build needed, so this fails fast. A schema mistake in these files otherwise only
  # shows up when the workflow or Dependabot first runs it.
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Validate workflow and Dependabot config files
        run: |
          pipx run check-jsonschema==0.39.0 --builtin-schema vendor.github-workflows .github/workflows/*.yml
          pipx run check-jsonschema==0.39.0 --builtin-schema vendor.dependabot .github/dependabot.yml

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # JDK 25 like local development: NullAway in JSpecify mode (pom.xml) needs JDK 22+ to run.
      # The code still compiles for Java 21 (<release>21</release> in pom.xml).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and static analysis
        run: ./mvnw -B verify -DskipTests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The input files live in a separate repository; testdata.ref pins the commit to use.
      - name: Read the pinned test data commit
        id: pin
        run: echo "ref=$(tr -d '[:space:]' < testdata.ref)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: globbestael/dedupendnote-testdata
          ref: ${{ steps.pin.outputs.ref }}
          path: testdata

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Unit tests
        run: ./mvnw -B test -Punit-tests
        env:
          DEDUP_TESTDATA_DIR: ${{ github.workspace }}/testdata

      - name: Integration tests
        run: ./mvnw -B test -Pintegration-tests
        env:
          DEDUP_TESTDATA_DIR: ${{ github.workspace }}/testdata

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
