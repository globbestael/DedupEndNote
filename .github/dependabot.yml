version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    # Spring Boot's parent POM manages most versions; Dependabot proposes parent bumps itself.
    groups:
      # One PR for all Spring updates instead of one per dependency
      spring:
        patterns:
          - "org.springframework*"
