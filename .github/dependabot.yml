version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    groups:
      # One PR for all Spring Boot-managed updates instead of one per dependency
      spring-boot:
        patterns:
          - "org.springframework*"
    # Spring Boot's parent POM manages most versions; Dependabot proposes parent bumps itself
