version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    # Spring Boot's parent POM manages most versions; Dependabot proposes parent bumps itself.
    groups:
      # One PR for all Spring updates instead of one per dependency
      spring:
        patterns:
          - "org.springframework*"
      # rewrite-maven-plugin and its rewrite-spring recipe dependency must move together:
      # a newer rewrite-spring with an older plugin makes the recipe delete every file (#93)
      openrewrite:
        patterns:
          - "org.openrewrite*"
